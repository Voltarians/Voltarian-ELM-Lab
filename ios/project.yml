name: VoltarianELMCompanion
options:
  bundleIdPrefix: org.voltarians
  deploymentTarget:
    iOS: "16.0"
targets:
  VoltarianELMCompanion:
    type: application
    platform: iOS
    sources: [VoltarianELMCompanion]
    info:
      path: VoltarianELMCompanion/Info.plist
      properties:
        CFBundleDisplayName: Voltarian ELM Companion
        NSLocalNetworkUsageDescription: Discovers and connects to Voltarian ELM Lab on your local network.
        NSBonjourServices:
          - _voltarian-elm._tcp.
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.voltarians.elmlab.companion
        PRODUCT_NAME: Voltarian ELM Companion
        SWIFT_VERSION: 5.9
        TARGETED_DEVICE_FAMILY: "1,2"
