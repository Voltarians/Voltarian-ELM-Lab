name: VoltarianELMCompanion
options:
  bundleIdPrefix: org.voltarians
  deploymentTarget:
    iOS: "16.0"
targets:
  VoltarianELMCompanion:
    type: application
    platform: iOS
    sources: [VoltarianELMCompanion]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.voltarians.elmlab.companion
        PRODUCT_NAME: Voltarian ELM Companion
        SWIFT_VERSION: 5.9
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Voltarian ELM Companion
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connects to Voltarian ELM Lab on your local network.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"

